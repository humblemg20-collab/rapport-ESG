services:
  - type: web
    name: afrigreen24-esg-premium-renderer
    runtime: docker
    plan: free
    rootDir: premium-renderer
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_RENDER_BODY_BYTES
        value: "5000000"
      - key: RENDERER_API_TOKEN
        sync: false
