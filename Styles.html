<style>
:root {
  --primary: #176b4d;
  --primary-dark: #0f5138;
  --secondary: #e9f5ef;
  --background: #f4f7f5;
  --surface: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #dfe7e2;
  --danger: #b91c1c;
  --warning: #b45309;
  --shadow: 0 18px 45px rgba(31, 41, 55, 0.09);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    linear-gradient(
      180deg,
      #edf7f1 0,
      var(--background) 330px
    );
  color: var(--text);
  font-family:
    Inter,
    Arial,
    Helvetica,
    sans-serif;
  line-height: 1.55;
}

button,
input,
select,
textarea {
  font: inherit;
}

.hidden {
  display: none !important;
}

.app {
  width: min(1180px, calc(100% - 32px));
  margin: 0 auto;
  padding: 34px 0 50px;
}

.main-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 30px;
  padding: 10px 4px 34px;
}

.brand {
  margin-bottom: 10px;
  color: var(--primary);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.main-header h1 {
  max-width: 780px;
  margin: 0;
  font-size: clamp(30px, 5vw, 52px);
  line-height: 1.05;
}

.main-header p {
  max-width: 760px;
  margin: 18px 0 0;
  color: var(--muted);
  font-size: 17px;
}

.version-badge {
  flex: none;
  border: 1px solid rgba(23, 107, 77, 0.18);
  border-radius: 999px;
  background: var(--surface);
  color: var(--primary);
  padding: 9px 15px;
  font-size: 13px;
  font-weight: 800;
}

.progress-wrapper {
  margin-bottom: 22px;
}

.steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.step-indicator {
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--muted);
  padding: 11px 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: default;
}

.step-indicator.active {
  background: var(--secondary);
  color: var(--primary);
}

.step-indicator.completed {
  color: var(--primary);
}

.progress-track {
  height: 7px;
  margin-top: 10px;
  overflow: hidden;
  border-radius: 99px;
  background: #dce8e1;
}

.progress-bar {
  width: 0;
  height: 100%;
  border-radius: inherit;
  background: var(--primary);
  transition: width 0.3s ease;
}

.main-card {
  border: 1px solid var(--border);
  border-radius: 24px;
  background: var(--surface);
  box-shadow: var(--shadow);
  padding: clamp(22px, 5vw, 52px);
}

.form-step {
  display: none;
}

.form-step.active {
  display: block;
  animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.section-heading {
  margin-bottom: 30px;
}

.eyebrow {
  display: block;
  margin-bottom: 7px;
  color: var(--primary);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.section-heading h2 {
  margin: 0;
  font-size: clamp(25px, 4vw, 36px);
}

.section-heading p {
  max-width: 760px;
  margin: 12px 0 0;
  color: var(--muted);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.form-field.full {
  grid-column: 1 / -1;
}

.form-field label,
.field-label {
  font-size: 14px;
  font-weight: 750;
}

.required-mark {
  color: var(--danger);
}

.form-control {
  width: 100%;
  min-height: 48px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #ffffff;
  color: var(--text);
  padding: 11px 13px;
  outline: none;
  transition:
    border-color 0.2s,
    box-shadow 0.2s;
}

.form-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(23, 107, 77, 0.1);
}

textarea.form-control {
  min-height: 85px;
  resize: vertical;
}

.checkbox-grid {
  display: grid;
  gap: 9px;
}

.checkbox-option {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}

.legend {
  margin-bottom: 22px;
  border: 1px solid #d4e8dc;
  border-radius: 12px;
  background: #f4fbf7;
  padding: 13px 15px;
  color: #365548;
  font-size: 13px;
}

.pillar-group {
  margin-bottom: 20px;
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.pillar-group summary {
  cursor: pointer;
  background: var(--secondary);
  color: var(--primary-dark);
  padding: 17px 20px;
  font-weight: 800;
}

.pillar-content {
  padding: 5px 20px 20px;
}

.question-card {
  padding: 22px 0;
  border-bottom: 1px solid var(--border);
}

.question-card:last-child {
  border-bottom: 0;
}

.question-number {
  color: var(--primary);
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.question-card h3 {
  margin: 7px 0 8px;
  font-size: 17px;
}

.question-meta {
  margin: 0 0 15px;
  color: var(--muted);
  font-size: 13px;
}

.question-inputs {
  display: grid;
  grid-template-columns: 1.3fr 0.8fr;
  gap: 14px;
}

.question-comment {
  grid-column: 1 / -1;
}

.critical-badge {
  display: inline-flex;
  margin-left: 8px;
  border-radius: 99px;
  background: #fef2f2;
  color: var(--danger);
  padding: 3px 7px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.digital-list {
  display: grid;
  gap: 18px;
}

.digital-card {
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
}

.digital-card h3 {
  margin: 0 0 15px;
  font-size: 17px;
}

.digital-options {
  display: grid;
  gap: 9px;
}

.digital-option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 12px;
  cursor: pointer;
}

.digital-option:hover {
  border-color: #9bc5b0;
  background: #f7fcf9;
}

.review-box {
  margin-bottom: 24px;
  border-radius: 15px;
  background: var(--secondary);
  padding: 18px;
}

.review-box strong {
  color: var(--primary);
}

.consent-list {
  display: grid;
  gap: 13px;
}

.consent-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
}

.consent-card.required {
  border-left: 4px solid var(--primary);
}

.consent-card input {
  width: 18px;
  height: 18px;
  margin-top: 3px;
}

.consent-card strong {
  display: block;
  margin-bottom: 4px;
}

.navigation {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 34px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

.button {
  min-height: 48px;
  border: 0;
  border-radius: 11px;
  padding: 11px 21px;
  font-weight: 800;
  cursor: pointer;
}

.button-primary {
  margin-left: auto;
  background: var(--primary);
  color: #ffffff;
}

.button-primary:hover {
  background: var(--primary-dark);
}

.button-secondary {
  border: 1px solid var(--border);
  background: #ffffff;
  color: var(--text);
}

.error-message {
  margin-top: 20px;
  border: 1px solid #fecaca;
  border-radius: 11px;
  background: #fef2f2;
  color: var(--danger);
  padding: 13px;
}

.loading-screen,
.submission-overlay {
  position: fixed;
  z-index: 999;
  inset: 0;
  display: grid;
  place-content: center;
  place-items: center;
  background: rgba(244, 247, 245, 0.96);
  text-align: center;
}

.submission-card {
  width: min(420px, calc(100vw - 36px));
  border-radius: 18px;
  background: #ffffff;
  box-shadow: var(--shadow);
  padding: 35px;
}

.loader {
  width: 43px;
  height: 43px;
  margin: 0 auto 16px;
  border: 4px solid #d5e8dd;
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.result-hero {
  text-align: center;
}

.result-score-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin: 28px 0;
}

.score-card {
  border: 1px solid var(--border);
  border-radius: 16px;
  background: #ffffff;
  padding: 22px;
}

.score-card strong {
  display: block;
  color: var(--primary);
  font-size: 34px;
}

.result-links,
.offer-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin-top: 22px;
}

.result-link,
.offer-card {
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 18px;
  text-decoration: none;
}

.result-link {
  display: block;
  background: var(--primary);
  color: #ffffff;
  font-weight: 800;
  text-align: center;
}

.offer-card {
  color: var(--text);
}

.offer-card h3 {
  margin: 0 0 8px;
  color: var(--primary);
}

.offer-card p {
  color: var(--muted);
}

.offer-cta {
  color: var(--primary);
  font-weight: 800;
}

footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 24px 5px 0;
  color: var(--muted);
  font-size: 12px;
}

@media (max-width: 760px) {
  .app {
    width: min(100% - 18px, 1180px);
    padding-top: 18px;
  }

  .main-header {
    display: block;
  }

  .version-badge {
    display: inline-block;
    margin-top: 18px;
  }

  .steps {
    grid-template-columns: repeat(2, 1fr);
  }

  .form-grid,
  .question-inputs,
  .result-score-grid,
  .result-links,
  .offer-grid {
    grid-template-columns: 1fr;
  }

  .question-comment,
  .form-field.full {
    grid-column: auto;
  }

  .main-card {
    border-radius: 17px;
    padding: 20px 15px;
  }

  footer {
    display: block;
  }

  footer span {
    display: block;
    margin-top: 6px;
  }
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  color: var(--primary);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.brand-logo {
  width: 56px;
  height: 56px;
  object-fit: contain;
  border-radius: 12px;
}


/* ============================================================
   ACCUEIL / CHOIX DU PARCOURS ESG
   ============================================================ */

.esg-landing-page {
  padding: 8px 4px 10px;
}

.esg-landing-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 40px;
}

.esg-landing-logo {
  width: 72px;
  height: 72px;
  border-radius: 16px;
  object-fit: contain;
}

.esg-landing-brand-copy {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.esg-landing-brand-copy strong {
  color: var(--text);
  font-size: 21px;
  font-weight: 850;
}

.esg-landing-brand-copy span {
  color: var(--primary);
  font-size: 14px;
  font-weight: 750;
}

.esg-landing-hero {
  max-width: 980px;
  margin-bottom: 42px;
}

.esg-landing-kicker {
  display: inline-flex;
  margin-bottom: 16px;
  border: 1px solid rgba(23, 107, 77, 0.16);
  border-radius: 999px;
  background: var(--surface);
  color: var(--primary);
  padding: 8px 13px;
  font-size: 12px;
  font-weight: 850;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.esg-landing-hero h1 {
  max-width: 920px;
  margin: 0;
  color: var(--text);
  font-size: clamp(36px, 5.8vw, 66px);
  line-height: 1.02;
  letter-spacing: -0.035em;
}

.esg-landing-hero p {
  max-width: 900px;
  margin: 22px 0 0;
  color: var(--muted);
  font-size: clamp(17px, 2vw, 21px);
  line-height: 1.65;
}

.esg-importance-section {
  margin-bottom: 48px;
}

.esg-importance-heading {
  max-width: 760px;
  margin-bottom: 20px;
}

.esg-importance-heading h2,
.esg-path-intro h2 {
  margin: 0;
  color: var(--text);
  font-size: clamp(24px, 3vw, 34px);
  line-height: 1.2;
}

.esg-importance-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.esg-importance-card {
  min-height: 190px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.76);
  padding: 22px;
}

.esg-importance-number {
  display: inline-flex;
  margin-bottom: 24px;
  color: var(--primary);
  font-size: 12px;
  font-weight: 850;
}

.esg-importance-card h3 {
  margin: 0 0 8px;
  color: var(--text);
  font-size: 20px;
}

.esg-importance-card p {
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

.esg-path-intro {
  max-width: 760px;
  margin-bottom: 22px;
}

.esg-landing-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
  align-items: stretch;
}

.esg-path-card {
  display: flex;
  min-width: 0;
  min-height: 540px;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: 22px;
  background: var(--surface);
  box-shadow: 0 18px 45px rgba(31, 41, 55, 0.07);
  padding: clamp(22px, 3vw, 32px);
}

.esg-path-card-import {
  border-color: rgba(23, 107, 77, 0.28);
  background:
    linear-gradient(
      180deg,
      rgba(233, 245, 239, 0.72),
      #ffffff 42%
    );
}

.esg-path-card-content {
  display: flex;
  flex: 1;
  flex-direction: column;
}

.esg-path-tag {
  align-self: flex-start;
  margin-bottom: 20px;
  border-radius: 999px;
  background: var(--secondary);
  color: var(--primary);
  padding: 7px 11px;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.esg-path-card h2 {
  margin: 0 0 12px;
  color: var(--text);
  font-size: clamp(25px, 3vw, 32px);
  line-height: 1.18;
}

.esg-path-card p {
  color: var(--muted);
  line-height: 1.65;
}

.esg-path-lead {
  margin: 0 0 6px;
  color: var(--primary-dark) !important;
  font-size: 16px;
  font-weight: 800;
}

.esg-path-card-content > p:not(.esg-path-lead) {
  margin: 4px 0 18px;
}

.esg-path-points {
  display: grid;
  gap: 10px;
  margin: 8px 0 24px;
  padding: 0;
  list-style: none;
}

.esg-path-points li {
  position: relative;
  padding-left: 24px;
  color: #465548;
  font-size: 14px;
  line-height: 1.45;
}

.esg-path-points li::before {
  position: absolute;
  left: 0;
  top: 0.15em;
  color: var(--primary);
  content: "✓";
  font-weight: 900;
}

.esg-import-benefit {
  margin: 2px 0 22px;
  border-left: 3px solid var(--primary);
  border-radius: 0 10px 10px 0;
  background: #f5faf7;
  color: #365548;
  padding: 13px 14px;
  font-size: 13px;
  line-height: 1.55;
}

.esg-path-actions {
  display: grid;
  gap: 10px;
  margin-top: auto;
}

.esg-path-primary-button {
  width: 100%;
  margin-left: 0;
}

.esg-path-note {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.esg-import-section {
  margin-top: auto;
}

.esg-import-dropzone {
  border: 2px dashed #b7d7c2;
  border-radius: 15px;
  background: #ffffff;
  padding: 18px;
  text-align: center;
}

.esg-import-dropzone p {
  margin: 10px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.esg-import-files-list,
.esg-import-progress,
.esg-import-error,
.esg-import-summary {
  margin-top: 13px;
  border-radius: 12px;
  padding: 13px;
}

.esg-import-files-list {
  border: 1px solid var(--border);
  background: #ffffff;
  color: #4b5563;
  font-size: 12px;
  line-height: 1.6;
}

.esg-import-progress {
  border: 1px solid #d5e8dd;
  background: #f4fbf7;
}

.esg-import-progress-head {
  display: flex;
  align-items: flex-start;
  gap: 11px;
}

.esg-import-progress-spinner {
  width: 20px;
  height: 20px;
  flex: none;
  margin-top: 2px;
  border: 3px solid #d5e8dd;
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.85s linear infinite;
}

.esg-import-progress-copy strong {
  display: block;
  color: var(--primary-dark);
  font-size: 13px;
}

.esg-import-progress-copy span {
  display: block;
  margin-top: 3px;
  color: #547064;
  font-size: 12px;
  line-height: 1.45;
}

.esg-import-progress-track {
  height: 6px;
  margin-top: 12px;
  overflow: hidden;
  border-radius: 999px;
  background: #dce8e1;
}

.esg-import-progress-bar {
  width: 36%;
  height: 100%;
  border-radius: inherit;
  background: var(--primary);
  animation: esgImportProgress 1.7s ease-in-out infinite alternate;
}

@keyframes esgImportProgress {
  from {
    transform: translateX(-35%);
  }

  to {
    transform: translateX(185%);
  }
}

.esg-import-progress-note {
  margin-top: 10px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
}

.esg-import-error {
  border: 1px solid #fecaca;
  background: #fef2f2;
  color: var(--danger);
  font-size: 12px;
  line-height: 1.5;
}

.esg-import-summary {
  padding: 0;
}

.esg-import-result-card {
  border: 1px solid #dce9e1;
  border-radius: 16px;
  background: #ffffff;
  box-shadow: 0 8px 24px rgba(31, 41, 55, 0.05);
  padding: 20px;
}

.esg-import-result-kicker {
  margin-bottom: 7px;
  color: var(--primary);
  font-size: 11px;
  font-weight: 850;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.esg-import-result-card h3 {
  margin: 0 0 8px;
  color: var(--text);
  font-size: 20px;
  line-height: 1.3;
}

.esg-import-result-card > p {
  margin: 0 0 17px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.55;
}

.esg-import-result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 17px;
}

.esg-import-result-progress-label {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 11px;
}

.esg-import-result-progress {
  height: 8px;
  margin-bottom: 16px;
  overflow: hidden;
  border-radius: 999px;
  background: #edf0f2;
}

.esg-import-result-progress > div {
  height: 100%;
  border-radius: inherit;
  background: var(--primary);
}

.esg-import-result-remaining {
  margin-bottom: 16px;
  border-radius: 10px;
  background: #f8faf9;
  color: #374151;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.5;
}

.esg-import-result-card .button-primary {
  width: 100%;
  margin-left: 0;
}

.esg-landing-disclaimer {
  max-width: 820px;
  margin: 20px auto 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
  text-align: center;
}


/* ============================================================
   EXPÉRIENCE DU QUESTIONNAIRE APRÈS IMPORT
   ============================================================ */

.esg-import-workspace-banner {
  margin-bottom: 22px;
